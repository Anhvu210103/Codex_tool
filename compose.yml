x-mailnotes-build: &mailnotes-build
  build:
    context: .
    dockerfile: Dockerfile

x-mailnotes-environment: &mailnotes-environment
  TZ: Asia/Ho_Chi_Minh
  MAILNOTES_PUBLIC_URL: "${MAILNOTES_PUBLIC_URL:-http://localhost:8080}"

services:
  mailnotes:
    <<: *mailnotes-build
    # Windows bind-mounted PDFs can be unreadable to the image's unprivileged UID.
    # Only .local and inbox are mounted; the host port remains loopback-only.
    user: "0:0"
    container_name: mailnotes
    restart: unless-stopped
    init: true

    environment:
      <<: *mailnotes-environment
      MAILNOTES_DOCKER_LOCAL_SETUP: "1"
      MAILNOTES_INBOX_DIR: /app/inbox
      MAILNOTES_INBOX_DISPLAY_PATH: "inbox (cạnh file mở tool trên máy này)"

    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./.local:/app/.local
      - ./inbox:/app/inbox

    command:
      - python
      - -m
      - mailnotes.web
      - --host
      - 0.0.0.0
      - --port
      - "8080"

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    security_opt:
      - no-new-privileges:true

    stop_grace_period: 30s

  demo:
    <<: *mailnotes-build
    profiles: ["tools"]
    init: true
    environment:
      <<: *mailnotes-environment
      MAILNOTES_INBOX_DIR: /app/inbox
    volumes:
      - ./.local:/app/.local
      - ./inbox:/app/inbox
    command:
      - python
      - -m
      - mailnotes.cli
      - demo
      - --config
      - /app/config.json
      - --input
      - /app/examples/messages.json
    restart: "no"

  cli-gmail:
    <<: *mailnotes-build
    profiles: ["tools"]
    init: true
    environment:
      <<: *mailnotes-environment
    volumes:
      - ./.local:/app/.local
    command:
      - python
      - -m
      - mailnotes.cli
      - once
      - --config
      - /app/config.json
      - --credentials
      - /app/.local/credentials.json
      - --token
      - /app/.local/token.json
    restart: "no"

  tests:
    <<: *mailnotes-build
    profiles: ["tools"]
    init: true
    environment:
      <<: *mailnotes-environment
      MAILNOTES_ADMIN_PASSWORD: ""
    tmpfs:
      - /app/.local
    command:
      - python
      - -m
      - unittest
      - discover
      - -s
      - tests
      - -v
    restart: "no"
