<!doctype html><html lang="vi"><meta charset="utf-8"><title>AI Gmail</title><link rel="stylesheet" href="popup.css"><body>
<h1>AI thao tác Gmail</h1><p>Mở danh sách thư có PDF trong Gmail trước. DeepSeek nhận chữ tên thư/nút trên trang. Mở thư có thể đánh dấu đã đọc.</p>
<label>Địa chỉ tool<input id="base" value="http://localhost:8080"></label>
<label>Mã ghép nối từ Cài đặt tool<input id="token" type="password"></label>
<button id="save">Lưu kết nối</button><button id="start">Bắt đầu AI — 1 thư</button><button id="stop">Dừng</button>
<p id="status" role="status">Chưa chạy.</p>
<details><summary>Nếu PDF chưa tự về sổ</summary><p>Chọn PDF vừa tải để chuyển vào sổ.</p><input id="file" type="file" accept=".pdf,application/pdf"><button id="upload">Ghi PDF vào sổ</button></details>
<script src="popup.js"></script></body></html>
