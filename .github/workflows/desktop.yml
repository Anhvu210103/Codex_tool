name: Build desktop apps
on:
  workflow_dispatch:
  push:
    branches: ['codex/admin-web']
    paths:
      - 'mailnotes/**'
      - 'packaging/**'
      - 'requirements*.txt'
      - '.github/workflows/desktop.yml'
    tags: ['desktop-v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifact: SoGhiChep-Linux-x86_64
          - os: macos-15
            artifact: SoGhiChep-macOS-AppleSilicon
          - os: macos-15-intel
            artifact: SoGhiChep-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-build.txt
      - run: python -m unittest discover -s tests -v
      - run: python packaging/build.py
      - name: Archive Linux app
        if: runner.os == 'Linux'
        run: tar -C dist -czf SoGhiChep-Linux.tar.gz SoGhiChep
      - name: Archive macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent dist/SoGhiChep.app SoGhiChep-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            SoGhiChep-Linux.tar.gz
            SoGhiChep-macOS.zip
          if-no-files-found: error
